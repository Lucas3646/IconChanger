name: Vérifications Flutter
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Render store assets
        run: |
          python3 -m pip install cairosvg
          python3 tool/create_store_graphics.py
          flutter test tool/play_store_screenshots.dart --no-pub
      - name: Build unsigned Play bundle for private upload signing
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('signingConfig = signingConfigs.getByName(if (signingFile.exists()) "personalRelease" else "debug")', 'signingConfig = null')
          p.write_text(s)
          PYCODE
          flutter build appbundle --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: icon-studio-play-1.0.1-build3
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/play-store/
          retention-days: 30
          if-no-files-found: error
