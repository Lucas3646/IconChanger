name: Native shortcut validation
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - name: Prepare unsigned aligned APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text().replace('signingConfig = signingConfigs.getByName(if (signingFile.exists()) "personalRelease" else "debug")', 'signingConfig = null')
          p.write_text(s)
          PY
          flutter build apk --release --no-pub
          mkdir -p delivery
          cp build/app/outputs/flutter-apk/app-release.apk delivery/Icon-Studio-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" delivery/
      - uses: actions/upload-artifact@v4
        with:
          name: icon-studio-1.0.2-unsigned
          path: delivery/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native tests on Android launcher
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tool/test_android_launcher.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-shortcut-test-results
          path: |
            android/app/build/reports/androidTests/
            build/app/reports/androidTests/
            build/launcher-proof/
            lib/
            test/
